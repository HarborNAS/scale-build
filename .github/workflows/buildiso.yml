name: relay migration source cache

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source-cache:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - name: Validate and bundle the proven source cache
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/sources"
          test -d "$source_dir"
          test -d "$source_dir/kernel/.git"
          sudo tar --zstd -cf "$RUNNER_TEMP/scale-build-sources-527cb3b.tar.zst" \
            -C "$GITHUB_WORKSPACE" sources
          sudo chown "$(id -u):$(id -g)" "$RUNNER_TEMP/scale-build-sources-527cb3b.tar.zst"
          (
            cd "$RUNNER_TEMP"
            sha256sum scale-build-sources-527cb3b.tar.zst \
              | tee scale-build-sources-527cb3b.tar.zst.sha256
          )
      - name: Upload source cache relay
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: scale-build-sources-527cb3b
          path: |
            ${{ runner.temp }}/scale-build-sources-527cb3b.tar.zst
            ${{ runner.temp }}/scale-build-sources-527cb3b.tar.zst.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  import-source-cache:
    needs: export-source-cache
    runs-on: [harbor-migration-canary]
    timeout-minutes: 60
    steps:
      - name: Download source cache relay
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scale-build-sources-527cb3b
          path: ${{ runner.temp }}/source-cache-relay
      - name: Verify and install source cache
        shell: bash
        run: |
          set -euo pipefail
          relay_dir="$RUNNER_TEMP/source-cache-relay"
          (
            cd "$relay_dir"
            sha256sum -c scale-build-sources-527cb3b.tar.zst.sha256
          )
          workspace="$GITHUB_WORKSPACE"
          test "$workspace" = "/export/actions-runner/_work/scale-build/scale-build"
          sudo rm -rf -- "$workspace/sources"
          sudo tar --zstd -xf "$relay_dir/scale-build-sources-527cb3b.tar.zst" -C "$workspace"
          test -d "$workspace/sources/kernel/.git"
          sudo du -sh "$workspace/sources"
